<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 - CSS Parte I</title>
    <style>
        .estilo1 {
            font-family: Georgia, 'Times New Roman', Times, serif; 
            color: aqua; 
            font-size: x-large;
        }
        span{
            font-style: italic; 
            font-weight: bolder; 
            color: black;
            text-decoration: underline; 
        }    
        em{
            font-style: italic; 
            font-weight: bolder; 
            color: black;
        }
    </style>
</head>
<body>
    <h1>DCC202 - CSS Parte I</h1>
    <p class="estilo1">Você pode aplicar um estilo <span >embutido</span> usando o elemento style no head </p>
    <div>
        <em>Color:</em>
        <ol>Cor texto do elemento</ol>
    </div>
    <div>
        <em>background-color:</em>
        <ol>Cor de fundo do elemento</ol>
    </div>
   
</body>
</html>
